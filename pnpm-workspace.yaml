packages:
  - 'apps/*'
  - 'packages/*'

# pnpm bloquea los scripts de instalacion por defecto desde la v10.
# Estos paquetes compilan o descargan binarios nativos y necesitan permiso.
# @scarf/scarf es telemetria de terceros: queda bloqueada a proposito.
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - eslint-plugin-react-refresh@0.5.5
  - '@ai-sdk/gateway@4.0.67'
  - '@ai-sdk/google@4.0.53'
  - '@ai-sdk/openai@4.0.49'
  - '@ai-sdk/provider-utils@5.0.32'
  - ai@7.0.82
  - '@tanstack/query-core@5.102.6'
  - '@tanstack/react-query@5.102.6'
  - '@tanstack/react-table@9.2.3'
  - '@tanstack/table-core@9.2.3'
