name: CI

on:
  pull_request:
    branches: [main]

# Un push nuevo al PR cancela la corrida anterior: no tiene sentido validar
# un commit que ya quedo atras.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # @calce/types y @calce/db se compilan primero: las apps consumen su
      # salida en dist, no el codigo fuente.
      - name: Construir paquetes compartidos
        run: pnpm build:packages

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
